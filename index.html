<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💗 셔니가 만든 프로필 꾸미기! 💗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'Jua', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: linear-gradient(135deg, #ffe6e6 0%, #f3e8ff 50%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: #fdf2f8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden; 
      display: flex;
      flex-direction: column;
    }
    @media (min-width: 480px) {
      .app-container {
        height: 90vh;
        border-radius: 35px;
        border: 10px solid #ffffff;
      }
    }
    
    .bounce-hover:hover { transform: translateY(-2px) scale(1.03); }
    .bounce-hover:active { transform: translateY(1px) scale(0.97); }
    
    .hidden-screen { display: none !important; }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.85);
      z-index: 500;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .comment-bubble {
        position: relative;
        background: #f3f4f6;
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 13px;
        color: #374151;
        margin-bottom: 4px;
        word-break: break-all;
    }

    .nav-item {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 0;
        color: #9ca3af;
        transition: all 0.2s;
    }
    .nav-item.active {
        color: #ec4899;
        font-weight: bold;
        transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">

    <!-- 🌟 알림창 -->
    <div id="custom-alert" class="hidden-screen absolute inset-0 z-[1000] flex items-center justify-center bg-black/40 backdrop-blur-sm px-4">
      <div class="bg-white rounded-3xl p-6 flex flex-col items-center w-full max-w-[300px] shadow-2xl">
        <div class="text-4xl mb-3">🔔</div>
        <p id="alert-message" class="text-gray-700 text-lg text-center mb-6 leading-relaxed"></p>
        <button onclick="closeAlert()" class="bg-pink-400 text-white px-8 py-2.5 rounded-full font-bold bounce-hover w-full shadow-md text-lg">확인</button>
      </div>
    </div>

    <!-- 🌟 로딩 화면 -->
    <div id="loading-screen" class="loading-overlay">
      <div class="text-6xl animate-spin mb-4">✨</div>
      <p class="text-pink-500 font-bold text-xl">마법의 방으로 이동 중...</p>
    </div>

    <!-- ========================================== -->
    <!-- 1. 시작(대문) 화면 (비밀번호) -->
    <!-- ========================================== -->
    <div id="screen-intro" class="hidden-screen w-full h-full flex flex-col items-center justify-center bg-gradient-to-b from-pink-100 to-purple-100 absolute inset-0 z-[200] pb-10 px-6">
      <div class="text-7xl mb-6 animate-bounce drop-shadow-md">💗</div>
      <h1 class="text-3xl sm:text-4xl text-pink-500 drop-shadow-sm mb-3 text-center leading-snug">
        셔니가 만든<br>프로필 꾸미기!
      </h1>
      <p class="text-gray-600 mb-8 text-sm text-center font-bold bg-white/60 py-3 px-5 rounded-2xl shadow-sm">
        🎉 친구네 집에 놀러가고 댓글도 달아요 🎉<br>
      </p>
      
      <div class="mb-6 flex flex-col items-center w-full max-w-[280px]">
        <label for="entry-password" class="text-pink-600 font-bold mb-2 text-lg">비밀 열쇠(입장 번호) 🗝️</label>
        <input type="password" id="entry-password" class="w-full border-4 border-pink-200 rounded-2xl p-4 text-center focus:outline-none focus:border-pink-400 text-xl shadow-inner bg-white/90" placeholder="여기에 입력!" onkeypress="if(event.key==='Enter') checkPassword()">
        <p class="text-xs text-pink-500 mt-3 font-bold bg-white/80 px-4 py-1.5 rounded-full shadow-sm">💡 관리자 번호도 여기에 적어주세요!</p>
      </div>

      <button onclick="checkPassword()" class="bounce-hover bg-pink-400 text-white text-2xl px-14 py-4 rounded-full shadow-[0_5px_15px_rgba(244,114,182,0.4)] font-bold border-4 border-white mt-4">
        ✨ 다음 ✨
      </button>
    </div>

    <!-- ========================================== -->
    <!-- 2. 별명 설정 화면 -->
    <!-- ========================================== -->
    <div id="screen-nickname" class="hidden-screen w-full h-full flex flex-col items-center justify-center bg-[#fff8e7] absolute inset-0 z-[200] pb-10 px-6">
      <div class="text-6xl mb-4 animate-bounce">🐣</div>
      <h2 class="text-3xl text-orange-400 font-bold mb-4 text-center">멋진 별명을<br>지어주세요!</h2>
      
      <div class="bg-yellow-100 border-2 border-yellow-300 p-4 rounded-2xl mb-8 w-full max-w-[300px] shadow-sm">
        <p class="text-base text-red-500 font-bold text-center mb-1">⚠️ 주의사항</p>
        <p class="text-sm text-gray-700 text-center break-keep leading-relaxed">진짜 이름을 적으면 다른 사람들이 볼 수 있어요! 나만의 멋진 별명이나 별명을 만들어주세요.</p>
      </div>
      
      <input type="text" id="entry-nickname" class="w-full max-w-[280px] border-4 border-orange-200 rounded-2xl p-4 text-center focus:outline-none focus:border-orange-400 text-xl shadow-inner bg-white mb-8" placeholder="예: 귀여운 토끼" onkeypress="if(event.key==='Enter') enterApp()">
      
      <button onclick="enterApp()" class="bounce-hover bg-orange-400 text-white text-2xl px-14 py-4 rounded-full shadow-lg font-bold border-4 border-white">
        🚪 열기
      </button>
    </div>

    <!-- ========================================== -->
    <!-- 메인 앱 영역 (탭 네비게이션 포함) -->
    <!-- ========================================== -->
    <div id="screen-main" class="hidden-screen w-full h-full flex flex-col bg-white absolute inset-0 z-50">
        
        <!-- 탭 내용 영역 -->
        <div class="flex-1 overflow-hidden relative">
            
            <!-- 🏠 탭 1: 친구 동네 -->
            <div id="tab-friends" class="w-full h-full flex flex-col bg-blue-50 absolute inset-0 transition-opacity">
                <div class="bg-white/90 backdrop-blur p-5 shadow-sm flex flex-col items-center z-10 sticky top-0 border-b-4 border-blue-100">
                    <h2 class="text-2xl text-blue-500 font-bold">🏠 친구들의 동네</h2>
                    <p class="text-xs text-gray-500 mt-1">별명을 눌러서 친구 방에 놀러가 보세요!</p>
                </div>
                <div class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-20" id="lobby-users-list">
                    <p class="text-center text-gray-400 mt-10">친구들을 찾고 있어요...👀</p>
                </div>
            </div>

            <!-- 💖 탭 2: 내 방 / 프로필 보기 (공용 화면) -->
            <div id="tab-profile" class="hidden-screen w-full h-full flex flex-col bg-white overflow-y-auto absolute inset-0 z-20 pb-20">
                
                <!-- 상단 뒤로가기 (친구 방일때만 보임) -->
                <div id="profile-back-btn" class="absolute top-4 left-4 z-30 hidden">
                    <button onclick="switchTab('friends')" class="bg-white/90 backdrop-blur text-gray-800 px-4 py-2 rounded-full font-bold shadow-lg bounce-hover text-sm border-2 border-gray-100">
                    &lt; 동네로 돌아가기
                    </button>
                </div>

                <!-- 배경 -->
                <div class="relative w-full h-64 bg-pink-100 flex-shrink-0 group">
                    <img id="display-bg" src="https://placehold.co/600x400/fbcfe8/ffffff?text=배경화면" alt="배경" class="w-full h-full object-cover">
                    <!-- 내 방일 때 보이는 배경 수정 버튼 -->
                    <label id="edit-bg-btn" class="hidden absolute bottom-3 right-3 bg-white/90 text-pink-600 px-4 py-2 rounded-full text-sm font-bold shadow-lg cursor-pointer bounce-hover border-2 border-pink-200">
                        📷 배경 바꾸기
                        <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'bg_url')">
                    </label>
                </div>

                <!-- 프로필 정보 -->
                <div class="px-5 relative pb-6 flex-shrink-0">
                    <!-- 프사 -->
                    <div class="absolute -top-16 left-5 p-1.5 bg-white rounded-full shadow-lg z-10 group">
                        <img id="display-profile" src="https://placehold.co/200x200/e879f9/ffffff?text=프사" alt="프사" class="w-28 h-28 rounded-full object-cover border-4 border-pink-50 bg-white">
                        <!-- 내 방일 때 보이는 프사 수정 버튼 -->
                        <label id="edit-profile-btn" class="hidden absolute bottom-0 -right-2 bg-pink-400 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-md cursor-pointer bounce-hover border-2 border-white text-xl">
                            +
                            <input type="file" accept="image/*" class="hidden" onchange="uploadImage(event, 'profile_url')">
                        </label>
                    </div>
                    
                    <!-- 뱃지 영역 -->
                    <div class="flex justify-end pt-4 gap-2 h-12">
                        <div id="admin-badge" class="hidden bg-yellow-400 text-white px-3 py-1 rounded-full text-xs font-bold shadow flex items-center">
                            👑 관리자
                        </div>
                    </div>

                    <!-- 이름 및 상태메시지 -->
                    <div class="mt-2">
                        <h2 id="display-nickname" class="text-3xl text-gray-800 font-bold flex items-center gap-2">
                            이름 <span class="text-lg font-normal text-gray-400">님의 방</span>
                        </h2>
                        
                        <!-- 프로필 꾸미러 가기 버튼 (내 방일 때만 보임) -->
                        <button id="toggle-edit-mode-btn" onclick="toggleEditMode()" class="hidden mt-3 bg-pink-100 text-pink-600 border-2 border-pink-200 px-4 py-2 rounded-full text-sm font-bold shadow-sm bounce-hover">
                            ✨ 프로필 꾸미러 가기
                        </button>

                        <div class="mt-4">
                            <p class="text-sm text-pink-400 mb-1 font-bold">💭 상태메시지</p>
                            <!-- 친구 방이거나 꾸미기 모드가 아닐 때 보이는 텍스트 -->
                            <p id="display-status" class="text-base text-gray-700 bg-pink-50 p-4 rounded-2xl whitespace-pre-wrap border border-pink-100 shadow-inner min-h-[60px]">오늘도 행복한 하루!</p>
                            
                            <!-- 꾸미기 모드일 때 보이는 입력칸 -->
                            <div id="edit-status-container" class="hidden flex flex-col gap-2">
                                <textarea id="edit-status" class="w-full bg-white border-2 border-pink-300 rounded-2xl p-3 text-gray-700 focus:outline-none focus:border-pink-500 resize-none h-20 shadow-inner text-sm" placeholder="상태메시지를 적어보세요!"></textarea>
                                <button onclick="saveStatus()" class="self-end bg-pink-400 text-white px-5 py-2 rounded-full text-sm font-bold shadow-sm bounce-hover">저장하기</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 게시물 영역 -->
                <div class="px-5 mt-2 flex-1 border-t-4 border-gray-50 pt-6 rounded-t-3xl bg-white">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl text-gray-800 font-bold">📸 올린 게시물들</h3>
                        <!-- 내 방일 때 보이는 게시물 올리기 버튼 -->
                        <label id="add-post-btn" class="hidden bg-purple-500 text-white px-4 py-2 rounded-full text-sm font-bold shadow-md cursor-pointer bounce-hover">
                            + 게시물 올리기
                            <input type="file" accept="image/*" class="hidden" onchange="uploadPost(event)">
                        </label>
                    </div>
                    <div class="flex flex-col gap-6" id="display-posts-container">
                        <!-- JS로 게시물들 그려짐 -->
                    </div>
                </div>
            </div>

            <!-- 💬 탭 3: 채팅방 -->
            <div id="tab-chat" class="hidden-screen w-full h-full flex flex-col bg-[#a5b4c1] absolute inset-0 z-10">
                <div class="bg-white/90 backdrop-blur p-4 shadow-sm flex items-center justify-center z-10 flex-shrink-0 border-b-2 border-gray-200">
                    <h2 class="text-xl text-gray-800 font-bold">다같이 채팅방 💬</h2>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 pb-4">
                    <!-- JS 렌더링 -->
                </div>
                <div class="bg-white p-3 shadow-lg flex items-center gap-2 flex-shrink-0 mb-4 mx-2 rounded-full border-2 border-gray-100">
                    <input type="text" id="chat-message-input" class="flex-1 bg-transparent px-3 py-2 focus:outline-none text-gray-700 font-bold" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()" class="bg-yellow-400 text-yellow-900 w-11 h-11 rounded-full flex items-center justify-center shadow bounce-hover">
                    🚀
                    </button>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 바 -->
        <div class="bg-white border-t-2 border-gray-100 flex items-center justify-around h-16 flex-shrink-0 px-2 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50">
            <button id="nav-btn-friends" onclick="switchTab('friends')" class="nav-item">
                <span class="text-2xl mb-0.5">🏠</span>
                <span class="text-xs">동네</span>
            </button>
            <button id="nav-btn-profile" onclick="switchTab('profile', window.myUserId)" class="nav-item">
                <span class="text-2xl mb-0.5">💖</span>
                <span class="text-xs">내 방</span>
            </button>
            <button id="nav-btn-chat" onclick="switchTab('chat')" class="nav-item">
                <span class="text-2xl mb-0.5">💬</span>
                <span class="text-xs">채팅</span>
            </button>
        </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'shunny-multi-profile-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-project" };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.myNickname = "";
    window.myUserId = "";
    window.isAdmin = false;
    window.currentViewUid = ""; 
    window.isEditMode = false; // 꾸미기 모드 상태 저장

    let usersData = {};
    let postsData = [];
    let commentsData = [];
    let isFirebaseReady = false;

    window.showLoading = (show) => {
      document.getElementById('loading-screen').classList.toggle('hidden-screen', !show);
    };

    window.showCustomAlert = (msg) => {
        document.getElementById('alert-message').innerText = msg;
        document.getElementById('custom-alert').classList.remove('hidden-screen');
    };

    window.closeAlert = () => {
        document.getElementById('custom-alert').classList.add('hidden-screen');
    };

    // 이미지 압축 (크기 줄이기) 함수
    function compressImage(file, maxWidth, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function() {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                callback(compressedDataUrl);
            }
        }
    }

    async function initAuth() {
        showLoading(true);
        try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            window.myUserId = auth.currentUser.uid;
            isFirebaseReady = true;
            document.getElementById('screen-intro').classList.remove('hidden-screen');
        } catch (error) {
            console.error(error);
            showCustomAlert("앗! 마법의 서버와 연결이 끊어졌어요. 새로고침 해주세요!");
        } finally {
            showLoading(false);
        }
    }
    initAuth();

    window.checkPassword = function() {
      const pwdInput = document.getElementById('entry-password').value.trim();
      
      if (pwdInput === 'shjshj12120160524') {
        window.isAdmin = true;
        document.getElementById('entry-password').value = ''; 
        
        const nickInput = document.getElementById('entry-nickname');
        nickInput.value = '관리자 뽀그리';
        nickInput.readOnly = true;
        nickInput.classList.add('bg-gray-200', 'text-gray-500');
        
        document.getElementById('screen-intro').classList.add('hidden-screen');
        document.getElementById('screen-nickname').classList.remove('hidden-screen');
        
      } else if (pwdInput === 'ILoveyou') {
        window.isAdmin = false;
        document.getElementById('entry-password').value = ''; 
        
        const nickInput = document.getElementById('entry-nickname');
        nickInput.value = '';
        nickInput.readOnly = false;
        nickInput.classList.remove('bg-gray-200', 'text-gray-500');
        
        document.getElementById('screen-intro').classList.add('hidden-screen');
        document.getElementById('screen-nickname').classList.remove('hidden-screen');
        
      } else {
        showCustomAlert("입장 번호가 틀렸어요! 🗝️ 다시 확인해주세요.");
      }
    };

    window.enterApp = async function() {
      const nickInput = document.getElementById('entry-nickname').value.trim();
      if (!nickInput) {
        showCustomAlert("별명을 꼭 입력해야 들어갈 수 있어요!");
        return;
      }
      if(!isFirebaseReady || !window.myUserId) {
          showCustomAlert("서버와 연결 중이에요. 잠시 후 다시 눌러주세요!");
          return;
      }
      
      window.myNickname = nickInput;
      
      const myUserRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', window.myUserId);
      try {
          await setDoc(myUserRef, {
              uid: window.myUserId,
              nickname: window.myNickname,
              timestamp: Date.now()
          }, { merge: true }); 
      } catch (err) {
          console.error(err);
      }

      document.getElementById('screen-nickname').classList.add('hidden-screen');
      document.getElementById('screen-main').classList.remove('hidden-screen');
      
      startListeningAllData();
      switchTab('profile', window.myUserId); // 앱 열면 기본으로 내 방 보여주기
    };

    function startListeningAllData() {
        const usersCol = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        onSnapshot(usersCol, (snap) => {
            usersData = {};
            snap.forEach(doc => { usersData[doc.id] = doc.data(); });
            renderLobby();
            if(window.currentViewUid) renderProfile(window.currentViewUid);
        }, err => console.error(err));

        const postsCol = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
        onSnapshot(postsCol, (snap) => {
            postsData = [];
            snap.forEach(doc => { postsData.push({ id: doc.id, ...doc.data() }); });
            if(window.currentViewUid) renderProfile(window.currentViewUid);
        }, err => console.error(err));

        const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'comments');
        onSnapshot(commentsCol, (snap) => {
            commentsData = [];
            snap.forEach(doc => { commentsData.push({ id: doc.id, ...doc.data() }); });
            if(window.currentViewUid) renderProfile(window.currentViewUid);
        }, err => console.error(err));

        const chatCol = collection(db, 'artifacts', appId, 'public', 'data', 'chat');
        onSnapshot(chatCol, (snap) => {
            let msgs = [];
            snap.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
            renderChat(msgs);
        }, err => console.error(err));
    }

    window.switchTab = function(tabName, targetUid = null) {
        // 탭 이동시 꾸미기 모드 무조건 끄기
        window.isEditMode = false;
        
        document.getElementById('tab-friends').classList.add('hidden-screen');
        document.getElementById('tab-profile').classList.add('hidden-screen');
        document.getElementById('tab-chat').classList.add('hidden-screen');

        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        if (tabName === 'friends') {
            document.getElementById('tab-friends').classList.remove('hidden-screen');
            document.getElementById('nav-btn-friends').classList.add('active');
        } else if (tabName === 'profile') {
            document.getElementById('tab-profile').classList.remove('hidden-screen');
            if(targetUid === window.myUserId) {
                document.getElementById('nav-btn-profile').classList.add('active');
            }
            openProfile(targetUid || window.myUserId);
        } else if (tabName === 'chat') {
            document.getElementById('tab-chat').classList.remove('hidden-screen');
            document.getElementById('nav-btn-chat').classList.add('active');
            const chatBox = document.getElementById('chat-messages');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    };

    function renderLobby() {
        const listContainer = document.getElementById('lobby-users-list');
        listContainer.innerHTML = '';

        const usersArr = Object.values(usersData).sort((a,b) => b.timestamp - a.timestamp);
        
        usersArr.forEach(user => {
            const isMe = user.uid === window.myUserId;
            const div = document.createElement('div');
            // 전체 클릭 이벤트(div.onclick) 대신 안쪽 요소에 클릭 이벤트를 주도록 수정했어요!
            div.className = "bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between bounce-hover border border-blue-50";
            
            const pfp = user.profile_url || "https://placehold.co/100x100/e879f9/ffffff?text=프사";
            const adminIcon = user.nickname === '관리자 뽀그리' ? '👑 ' : '';
            const meBadge = isMe ? '<span class="bg-pink-100 text-pink-500 text-xs px-2 py-1 rounded-full font-bold ml-2">나</span>' : '';

            // 👑 관리자이면서 자기 자신이 아닐 때만 '지우기' 버튼 만들기
            let deleteBtnHTML = '';
            if (window.isAdmin && !isMe) {
                deleteBtnHTML = `<button onclick="event.stopPropagation(); deleteUser('${user.uid}', '${user.nickname}')" class="bg-red-400 text-white px-3 py-1 rounded-full text-xs font-bold shadow-sm bounce-hover ml-2">❌ 지우기</button>`;
            }

            div.innerHTML = `
                <div class="flex items-center gap-4 flex-1 cursor-pointer" onclick="switchTab('profile', '${user.uid}')">
                    <img src="${pfp}" class="w-14 h-14 rounded-full object-cover border-2 border-pink-100">
                    <div>
                        <h4 class="font-bold text-gray-800 text-lg flex items-center">${adminIcon}${user.nickname} ${meBadge}</h4>
                        <p class="text-xs text-gray-500 truncate max-w-[130px]">${user.status_msg || '오늘도 행복한 하루!'}</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    ${deleteBtnHTML}
                    <div class="text-blue-300 text-2xl font-bold cursor-pointer" onclick="switchTab('profile', '${user.uid}')">&gt;</div>
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    // 🗑️ 사람 지우기 마법 코드 추가!
    window.deleteUser = async function(targetUid, targetNickname) {
        if (!auth.currentUser || !window.isAdmin) return;
        
        try {
            showLoading(true);
            // 마법의 서버(데이터베이스)에서 그 사람 정보 지우기
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUid));
            showCustomAlert(`${targetNickname} 친구를 동네에서 내보냈어요! 👋`);
        } catch (err) {
            console.error(err);
            showCustomAlert("지우는 중에 오류가 발생했어요.");
        } finally {
            showLoading(false);
        }
    };

    function openProfile(targetUid) {
        window.currentViewUid = targetUid;
        renderProfile(targetUid);
    }

    window.toggleEditMode = function() {
        window.isEditMode = !window.isEditMode;
        renderProfile(window.myUserId);
    };

    function renderProfile(targetUid) {
        if (!usersData[targetUid]) return; 
        
        const userData = usersData[targetUid];
        const isMyRoom = targetUid === window.myUserId;

        // 텍스트/이미지 세팅
        document.getElementById('display-nickname').innerHTML = `${userData.nickname} <span class="text-lg font-normal text-gray-400">님의 방</span>`;
        document.getElementById('display-bg').src = userData.bg_url || "https://placehold.co/600x400/fbcfe8/ffffff?text=배경화면";
        document.getElementById('display-profile').src = userData.profile_url || "https://placehold.co/200x200/e879f9/ffffff?text=프사";
        
        // 상태 메시지 (수정 모드 vs 읽기 모드)
        const statusText = userData.status_msg || "오늘도 행복한 하루!";
        
        // 버튼 노출 기본 설정
        document.getElementById('add-post-btn').style.display = isMyRoom ? 'block' : 'none';
        document.getElementById('profile-back-btn').style.display = isMyRoom ? 'none' : 'block';
        document.getElementById('toggle-edit-mode-btn').style.display = isMyRoom ? 'block' : 'none';

        // 꾸미기 모드 적용 (내 방일 때만)
        if (isMyRoom && window.isEditMode) {
            document.getElementById('toggle-edit-mode-btn').innerText = "✅ 꾸미기 완료";
            document.getElementById('toggle-edit-mode-btn').classList.replace('bg-pink-100', 'bg-pink-500');
            document.getElementById('toggle-edit-mode-btn').classList.replace('text-pink-600', 'text-white');

            document.getElementById('edit-bg-btn').style.display = 'block';
            document.getElementById('edit-profile-btn').style.display = 'flex';
            
            document.getElementById('display-status').classList.add('hidden');
            document.getElementById('edit-status-container').classList.remove('hidden');
            document.getElementById('edit-status').value = userData.status_msg || "";
        } else {
            if(isMyRoom) {
                document.getElementById('toggle-edit-mode-btn').innerText = "✨ 프로필 꾸미러 가기";
                document.getElementById('toggle-edit-mode-btn').classList.replace('bg-pink-500', 'bg-pink-100');
                document.getElementById('toggle-edit-mode-btn').classList.replace('text-white', 'text-pink-600');
            }
            
            document.getElementById('edit-bg-btn').style.display = 'none';
            document.getElementById('edit-profile-btn').style.display = 'none';
            
            document.getElementById('display-status').classList.remove('hidden');
            document.getElementById('edit-status-container').classList.add('hidden');
            document.getElementById('display-status').innerText = statusText;
        }
        
        const adminBadge = document.getElementById('admin-badge');
        if(userData.nickname === '관리자 뽀그리') adminBadge.classList.remove('hidden');
        else adminBadge.classList.add('hidden');

        renderPosts(targetUid, isMyRoom);
    }

    function renderPosts(targetUid, isMyRoom) {
        const container = document.getElementById('display-posts-container');
        container.innerHTML = '';

        let myPosts = postsData.filter(p => p.uid === targetUid).sort((a,b) => b.timestamp - a.timestamp);

        if(myPosts.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-400 py-10 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">아직 올린 게시물이 없어요 📸</div>';
            return;
        }

        myPosts.forEach(post => {
            const postDiv = document.createElement('div');
            postDiv.className = "bg-white border border-pink-100 rounded-3xl shadow-sm overflow-hidden flex flex-col";
            
            let deleteBtnHTML = '';
            if(isMyRoom || window.isAdmin) {
                deleteBtnHTML = `<button onclick="deletePost('${post.id}')" class="absolute top-3 right-3 bg-white/90 text-red-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md font-bold text-sm bounce-hover">X</button>`;
            }

            let postComments = commentsData.filter(c => c.postId === post.id).sort((a,b) => a.timestamp - b.timestamp);
            let commentsHTML = postComments.map(c => {
                // 👑 관리자이거나, 내가 쓴 댓글일 때만 '지우기' 버튼을 보여주는 마법 코드!
                let delCom = (c.uid === window.myUserId || window.isAdmin) ? `<button onclick="deleteComment('${c.id}')" class="text-red-400 ml-2 text-xs font-bold hover:text-red-500 cursor-pointer bg-red-50 px-2 py-0.5 rounded-full border border-red-100 flex-shrink-0">지우기 🗑️</button>` : '';
                return `<div class="comment-bubble flex justify-between items-center"><span class="break-all"><span class="font-bold text-pink-500 mr-1">${c.nickname}:</span>${c.text}</span>${delCom}</div>`;
            }).join('');

            if(postComments.length === 0) commentsHTML = '<div class="text-xs text-gray-400 py-1">첫 댓글을 남겨보세요!</div>';

            postDiv.innerHTML = `
                <div class="relative w-full bg-gray-100 aspect-square">
                    <img src="${post.image_url}" class="w-full h-full object-cover">
                    ${deleteBtnHTML}
                </div>
                <div class="p-4 bg-pink-50/30">
                    <div class="max-h-32 overflow-y-auto mb-3 flex flex-col items-start gap-1">
                        ${commentsHTML}
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="comment-input-${post.id}" class="flex-1 border-2 border-pink-100 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-pink-300" placeholder="재밌는 댓글 달기!" onkeypress="if(event.key==='Enter') addComment('${post.id}')">
                        <button onclick="addComment('${post.id}')" class="bg-pink-400 text-white px-4 rounded-xl text-sm font-bold bounce-hover shadow-sm flex-shrink-0">등록</button>
                    </div>
                </div>
            `;
            container.appendChild(postDiv);
        });
    }

    window.uploadImage = async function(event, fieldName) {
        const file = event.target.files[0];
        if (!file || !auth.currentUser) return;
        
        showLoading(true);
        compressImage(file, 600, async function(compressedBase64) {
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', window.myUserId);
                const updateData = {};
                updateData[fieldName] = compressedBase64;
                await setDoc(userRef, updateData, { merge: true });
                showCustomAlert(fieldName === 'bg_url' ? "배경이 예쁘게 바뀌었어요! ✨" : "프사가 예쁘게 적용되었어요! ✨");
            } catch (err) {
                console.error(err);
            } finally {
                showLoading(false);
            }
        });
    };

    window.saveStatus = async function() {
        const text = document.getElementById('edit-status').value.trim();
        if(!auth.currentUser) return;
        
        const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', window.myUserId);
        try {
            await setDoc(userRef, { status_msg: text }, { merge: true });
            showCustomAlert("상태메시지가 저장되었어요! 💌");
        } catch(err) { console.error(err); }
    };

    window.uploadPost = async function(event) {
        const file = event.target.files[0];
        if (!file || !auth.currentUser) return;

        showLoading(true);
        compressImage(file, 500, async function(compressedBase64) {
            try {
                const postsCol = collection(db, 'artifacts', appId, 'public', 'data', 'posts');
                await addDoc(postsCol, {
                    image_url: compressedBase64,
                    uid: window.myUserId,
                    timestamp: Date.now()
                });
            } catch (err) { console.error(err); } 
            finally { showLoading(false); }
        });
    };

    window.deletePost = async function(postId) {
        if(!auth.currentUser) return;
        try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'posts', postId)); } 
        catch (err) { console.error(err); }
    };

    window.addComment = async function(postId) {
        if(!auth.currentUser) return;
        const input = document.getElementById(`comment-input-${postId}`);
        const text = input.value.trim();
        if(!text) return;

        try {
            input.value = '';
            const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'comments');
            await addDoc(commentsCol, {
                postId: postId,
                uid: window.myUserId,
                nickname: window.myNickname,
                text: text,
                timestamp: Date.now()
            });
        } catch(err) { console.error(err); }
    };

    window.deleteComment = async function(commentId) {
        if(!auth.currentUser) return;
        try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'comments', commentId)); } 
        catch (err) { console.error(err); }
    }

    function renderChat(msgs) {
        const chatBox = document.getElementById('chat-messages');
        msgs.sort((a,b) => a.timestamp - b.timestamp);
        
        chatBox.innerHTML = ''; 
        if(msgs.length === 0) {
            chatBox.innerHTML = '<div class="text-center text-gray-500 bg-white/50 rounded-full px-4 py-1 text-sm self-center my-2 font-bold">아직 메시지가 없어요. 안녕? 하고 인사해볼까요! 👋</div>';
        } else {
            msgs.forEach(msg => {
                const isMine = msg.uid === window.myUserId;
                const div = document.createElement('div');
                div.className = `flex flex-col w-full max-w-[80%] ${isMine ? 'self-end items-end' : 'self-start items-start'} mb-1`;
                
                if (!isMine) {
                    div.innerHTML += `<span class="text-xs text-gray-600 ml-2 mb-1 font-bold">${msg.nickname}</span>`;
                }

                const bubble = document.createElement('div');
                bubble.className = `px-4 py-2.5 text-sm shadow-sm font-bold ${isMine ? 'bg-yellow-300 text-yellow-900 rounded-2xl rounded-tr-sm' : 'bg-white text-gray-800 rounded-2xl rounded-tl-sm'} break-all`;
                bubble.innerText = msg.text;
                
                div.appendChild(bubble);
                chatBox.appendChild(div);
            });
        }
        
        if(!document.getElementById('tab-chat').classList.contains('hidden-screen')) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }

    window.sendChatMessage = async function() {
        const input = document.getElementById('chat-message-input');
        const text = input.value.trim();
        if (!text || !auth.currentUser) return;
        
        input.value = '';
        try {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chat'), {
                text: text,
                nickname: window.myNickname,
                uid: window.myUserId,
                timestamp: Date.now()
            });
        } catch (error) { console.error(error); }
    };

  </script>
</body>
</html>
